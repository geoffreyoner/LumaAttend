<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}LumaAttend{% endblock %}</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="bg-orbs"></div>
<nav class="nav glass" id="main-nav">
  <div class="nav-brand">
    <img src="/static/assets/logo.svg" alt="" class="logo-sm">
    <span>LumaAttend</span>
  </div>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 6h18M3 12h18M3 18h18"/>
    </svg>
  </button>
  <div class="nav-links" id="navLinks">
    {% if session.get('role') == 'admin' %}
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/attendance" class="nav-link">Attendance</a>
    <a href="/users" class="nav-link">Users</a>
    <a href="/history" class="nav-link">History</a>
    <a href="/settings" class="nav-link">Settings</a>
    {% else %}
    <a href="/attendance" class="nav-link">Attendance</a>
    {% endif %}
    <button class="btn btn-ghost" id="logoutBtn">Logout</button>
  </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<div class="toast-container" id="toastContainer"></div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
