{% extends "base.html" %}
{% block title %}Login — LumaAttend{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="glass login-card">
    <div class="login-header">
      <img src="/static/assets/logo.svg" alt="LumaAttend" class="logo-lg">
      <h1>LumaAttend</h1>
      <p class="text-muted">Face Recognition Attendance</p>
    </div>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
          <button type="button" class="btn-icon" id="togglePassword" aria-label="Show password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-error" id="loginError" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </form>
    <p class="text-muted login-footer">Local attendance system — camera required for face verification</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('togglePassword').addEventListener('click', () => {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
});
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  err.textContent = '';
  btn.disabled = true;
  btn.querySelector('.btn-text').textContent = 'Signing in...';
  btn.querySelector('.btn-spinner').classList.remove('hidden');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p}),
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = data.user.role === 'admin' ? '/dashboard' : '/attendance';
    } else {
      err.textContent = data.error || 'Login failed';
    }
  } catch (e) {
    err.textContent = 'Network error';
  } finally {
    btn.disabled = false;
    btn.querySelector('.btn-text').textContent = 'Sign In';
    btn.querySelector('.btn-spinner').classList.add('hidden');
  }
});
</script>
{% endblock %}
