{% extends "base.html" %}
{% block title %}Attendance — LumaAttend{% endblock %}
{% block content %}
<div class="attendance-layout">
  <div class="glass camera-panel">
    <div class="camera-header">
      <h2>Face Attendance</h2>
      <div class="camera-controls">
        <button class="btn btn-sm btn-ghost" id="switchCam" title="Switch camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="camera-stage" id="cameraStage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="face-guide" id="faceGuide"></div>
      <div class="camera-status glass" id="cameraStatus">Camera off</div>
    </div>
    <div class="camera-actions">
      <button class="btn btn-primary" id="startCam">Start Camera</button>
      <button class="btn btn-danger hidden" id="stopCam">Stop</button>
    </div>
    <div class="attendance-status glass" id="attendanceStatus">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Idle</span>
      </div>
    </div>
  </div>

  <div class="glass info-panel">
    <h3>Today's Record</h3>
    <div id="todayRecord" class="record-list">
      <p class="text-muted">No record yet</p>
    </div>
    <div class="attendance-btns">
      <button class="btn btn-primary btn-full" id="checkInBtn" disabled>Check In</button>
      <button class="btn btn-outline btn-full" id="checkOutBtn" disabled>Check Out</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/camera.js"></script>
<script src="/static/js/face-recognition.js"></script>
<script src="/static/js/attendance.js"></script>
{% endblock %}
