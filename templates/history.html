{% extends "base.html" %}
{% block title %}History — LumaAttend{% endblock %}
{% block content %}
<div class="page-header"><h1>Attendance History</h1></div>
<div class="glass panel">
  <div class="toolbar">
    <input type="date" id="filterFrom" class="input">
    <input type="date" id="filterTo" class="input">
    <select id="filterStatus" class="input">
      <option value="">All Status</option>
      <option>Hadir</option><option>Terlambat</option>
      <option>Izin</option><option>Sakit</option><option>Tidak Hadir</option>
    </select>
    <button class="btn btn-primary btn-sm" id="applyFilter">Filter</button>
    <a class="btn btn-outline btn-sm" href="/api/attendance/export.csv">Export CSV</a>
  </div>
  <div class="table-wrap">
    <table class="data-table" id="historyTable">
      <thead><tr>
        <th>Date</th><th>Code</th><th>Name</th>
        <th>Check In</th><th>Check Out</th><th>Status</th>
      </tr></thead>
      <tbody id="historyBody"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>
<script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
<script src="/static/js/history.js"></script>
{% endblock %}
